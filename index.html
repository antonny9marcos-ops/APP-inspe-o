<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Industrial - Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        window.tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#3B82F6",
                        "primary-glow": "#60A5FA",
                        "success": "#10B981",
                        "danger": "#EF4444",
                        "warning": "#F59E0B",
                        "bg-base": "#080C14",
                        "bg-surface": "#0D1421",
                        "bg-elevated": "#111927",
                        "bg-card": "#0F1A2E",
                        "border-subtle": "rgba(255,255,255,0.06)",
                        "text-primary": "#F1F5F9",
                        "text-muted": "#64748B",
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "display": ["Bricolage Grotesque", "Space Grotesk", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                    },
                    boxShadow: {
                        'glow-blue': '0 0 30px rgba(59,130,246,0.15)',
                        'glow-sm': '0 0 15px rgba(59,130,246,0.10)',
                        'glow-green': '0 0 20px rgba(16,185,129,0.15)',
                        'glow-red': '0 0 20px rgba(239,68,68,0.15)',
                        'card': '0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05)',
                        'card-hover': '0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08)',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <style>
        :root {
            --bg-base: #080C14;
            --bg-surface: #0D1421;
            --bg-elevated: #111927;
            --border: rgba(255,255,255,0.06);
            --accent: #3B82F6;
            --accent-glow: rgba(59,130,246,0.15);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: #F1F5F9;
            -webkit-font-smoothing: antialiased;
        }

        .font-display { font-family: 'Space Grotesk', sans-serif; }

        /* Glassmorphism utilities */
        .glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.07);
        }

        .glass-strong {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.10);
        }

        /* Animated grid background */
        .bg-grid {
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        /* Premium glow orb */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }

        /* Material symbols */
        .material-symbols-rounded {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        /* Active nav item */
        .active-nav {
            background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(59,130,246,0.08));
            border: 1px solid rgba(59,130,246,0.25);
            color: #60A5FA !important;
        }
        .active-nav .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            color: #3B82F6;
        }

        /* Status badges */
        .badge-approved {
            background: rgba(16,185,129,0.12);
            border: 1px solid rgba(16,185,129,0.25);
            color: #34D399;
        }
        .badge-rejected {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.25);
            color: #F87171;
        }
        .badge-attention {
            background: rgba(245,158,11,0.12);
            border: 1px solid rgba(245,158,11,0.25);
            color: #FBD166;
        }
        .badge-pending {
            background: rgba(100,116,139,0.12);
            border: 1px solid rgba(100,116,139,0.25);
            color: #94A3B8;
        }

        /* Custom dark scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

        /* Pulse dot animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        .pulse-dot::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: #10B981;
            animation: pulse-ring 1.5s ease-out infinite;
        }

        /* Gradient text */
        .text-gradient {
            background: linear-gradient(135deg, #F1F5F9 0%, #3B82F6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .text-gradient-gold {
            background: linear-gradient(135deg, #FCD34D 0%, #F59E0B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Hover card lift */
        .card-lift {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .card-lift:hover {
            transform: translateY(-3px);
        }

        /* Button primary glow */
        .btn-primary {
            background: linear-gradient(135deg, #2563EB, #3B82F6);
            box-shadow: 0 4px 20px rgba(59,130,246,0.35);
            transition: all 0.25s ease;
        }
        .btn-primary:hover {
            box-shadow: 0 6px 30px rgba(59,130,246,0.5);
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: scale(0.97); }

        /* Input dark */
        .input-dark {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: #F1F5F9;
            transition: all 0.2s ease;
        }
        .input-dark::placeholder { color: #4B5563; }
        .input-dark:focus {
            outline: none;
            border-color: rgba(59,130,246,0.5);
            background: rgba(59,130,246,0.05);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        /* Animated border gradient on cards */
        .border-glow {
            position: relative;
        }
        .border-glow::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(59,130,246,0.4), transparent, rgba(59,130,246,0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Table rows */
        .table-row-dark {
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.15s ease;
        }
        .table-row-dark:hover { background: rgba(255,255,255,0.03); }

        /* Global Dark Theme Overrides for All Components & Modals */
        input:not([type="checkbox"]):not([type="radio"]), select, textarea {
            background-color: rgba(15, 23, 42, 0.7) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #f1f5f9 !important;
        }
        input::placeholder, textarea::placeholder {
            color: #64748b !important;
        }
        input:focus, select:focus, textarea:focus {
            border-color: rgba(59, 130, 246, 0.6) !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15) !important;
        }
        select option {
            background-color: #0d1421 !important;
            color: #f1f5f9 !important;
        }
        
        /* Auto-elevate light card classes into dark glassmorphism */
        .bg-white {
            background-color: rgba(13, 20, 33, 0.82) !important;
            border-color: rgba(255, 255, 255, 0.08) !important;
            color: #f1f5f9 !important;
            backdrop-filter: blur(16px);
        }
        .bg-slate-50, .bg-slate-100 {
            background-color: rgba(255, 255, 255, 0.04) !important;
        }
        .border-slate-100, .border-slate-200, .border-slate-50 {
            border-color: rgba(255, 255, 255, 0.07) !important;
        }
        .text-slate-900, .text-slate-800 {
            color: #ffffff !important;
        }
        .text-slate-700, .text-slate-600 {
            color: #cbd5e1 !important;
        }
        .text-slate-500, .text-slate-400 {
            color: #94a3b8 !important;
        }
        .shadow-sm, .shadow-md, .shadow-xl, .shadow-2xl {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6) !important;
        }
    </style>

    <div class="glow-orb w-[600px] h-[600px] bg-blue-600/8 top-[-200px] right-[-200px]"></div>
